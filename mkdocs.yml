site_name: 7627 Software Documentation
site_description: Onboarding and technical documentation for 7627 software
site_author: Gianmarco Lenzi

theme:
  name: material
  palette:
    # Switches between light and dark modes based on user system settings
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

# Sidebar Navigation Structure
nav:
  - Welcome: index.md
  - Onboarding: onboarding.md
  - Technical Documentation: tech-docs.md
